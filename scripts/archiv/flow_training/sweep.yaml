program: ../../src/models/master/training/start_training_master.py
method: bayes
metric:
    name: eval/average_precision
    goal: maximize
parameters:
    lr:
        values: [1e-2, 1e-3, 1e-4, 3e-4, 3e-5, 1e-5]
    
    optim:
        values: ['Adam', 'RMSprop']
    
    epochs:
        min: 20
        max: 200
    
    weight_decay:
        min: -10
        max: 0
        distribution: log_uniform
        
    batch_size:
        values: [16, 32, 64, 128, 256]
    
    # amount of normal st_type layers in one coupling step
    num_blocks:
        min: 1
        max: 15
    
    # amount of coupling layers
    num_scales:
        min: 1
        max: 5
        
    # what architecture is used within the coupling layers
    st_type:
        values: ['highway', 'convnet', 'resnet', 'resnet_ae', 'autoencoder']

early_terminate:
    type: hyperband
    min_iter: 15
    eta: 3  # so we evaluate at [min_iter, min_iter*eta, min_iter*eta*eta, ...]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --model=nf
  - --dont_check
  - --flow=RealNVP
  - --dataset=mnist
  - --sample_every=5
  - --eval_every=1
  - --prior=Gaussian
  - --num_workers=0 
  - --root=/master-thesis-work/data/
  - --training_class=0
